<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Melomash</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            :root {
                /* Темная тема (по умолчанию) */
                --bg-primary: #121212;
                --bg-secondary: #181818;
                --bg-accent: rgba(255, 255, 255, 0.05);
                --bg-accent-hover: rgba(255, 255, 255, 0.1);
                --border-color: rgba(255, 255, 255, 0.05);
                --text-primary: #ffffff;
                --text-secondary: #e2e8f0;
                --text-muted: #94a3b8;
                --text-muted-hover: #cbd5e1;
                --gradient-start: #6366f1;
                --gradient-end: #8b5cf6;
            }

            [data-theme="light"] {
                /* Светлая тема */
                --bg-primary: #ffffff;
                --bg-secondary: #f8fafc;
                --bg-accent: rgba(0, 0, 0, 0.05);
                --bg-accent-hover: rgba(0, 0, 0, 0.1);
                --border-color: rgba(0, 0, 0, 0.1);
                --text-primary: #0f172a;
                --text-secondary: #334155;
                --text-muted: #64748b;
                --text-muted-hover: #475569;
                --gradient-start: #4f46e5;
                --gradient-end: #7c3aed;
            }

            body {
                background-color: var(--bg-primary);
                margin: 0;
                padding: 0;
                overflow: hidden;
                color: var(--text-secondary);
                transition: background-color 0.2s ease, color 0.2s ease;
            }

            #root {
                height: 100vh;
                width: 100vw;
            }

            /* Переходные эффекты для всех элементов темы */
            * {
                transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
