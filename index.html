<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Melomash</title>
        <style>
            body {
                background: #121212;
                color: white;
                font-family: sans-serif;
                margin: 0;
                padding: 20px;
            }
            .song-item {
                padding: 10px;
                border-bottom: 1px solid #333;
                cursor: pointer;
            }
            .song-item:hover {
                background: #222;
            }
            #login-form {
                background: #1e1e1e;
                padding: 20px;
                border-radius: 10px;
            }
            input {
                padding: 10px;
                width: 250px;
                margin-bottom: 10px;
                background: #333;
                color: white;
                border: none;
            }
            .player-controls {
                position: fixed;
                bottom: 60px;
                left: 0;
                width: 100%;
                background: #181818;
                padding: 15px;
                border-top: 1px solid #333;
                text-align: center;
            }
            .bottom-nav {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                background: #111;
                display: flex;
                justify-content: center;
                padding: 10px;
                gap: 20px;
            }
        </style>
    </head>
    <body>
        <div id="login-form">
            <input type="text" id="username" placeholder="Телефон или Email" />
            <input type="password" id="password" placeholder="Пароль" />
            <div id="2fa-area" style="display: none">
                <input type="text" id="otp-code" placeholder="Код 2FA" />
            </div>
            <button
                onclick="authAndLoad()"
                style="background: #0077ff; color: white; padding: 10px"
            >
                Войти
            </button>
        </div>

        <div id="status">Ожидание...</div>
        <div id="playlist"></div>

        <div class="player-controls">
            <span id="current-track">Ничего не играет</span>
            <button onclick="togglePlay()" id="play-btn">⏸ Пауза</button>
        </div>

        <div class="bottom-nav">
            <button onclick="location.reload()" style="color: #0077ff">
                VK Music
            </button>
            <button onclick="alert('Скоро!')" style="color: #ffcc00">
                Yandex
            </button>
        </div>

        <script src="renderer.js"></script>
    </body>
</html>
